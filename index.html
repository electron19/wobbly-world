<!DOCTYPE html>
<html lang="pl">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Wobbly World 🏘️</title>
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    body { overflow: hidden; background: #5BA8E5; }
    #loading {
      position: fixed; inset: 0; display: flex; flex-direction: column;
      align-items: center; justify-content: center; gap: 12px;
      background: #5BA8E5; color: white;
      font: bold 28px 'Arial Rounded MT Bold', Arial, sans-serif;
      z-index: 100; transition: opacity 0.6s;
    }
    #loading p { font-size: 14px; opacity: 0.75; font-weight: normal; }
    #ui {
      position: fixed; bottom: 20px; left: 50%;
      transform: translateX(-50%);
      color: white; font: bold 14px Arial, sans-serif;
      text-shadow: 0 2px 4px rgba(0,0,0,0.5);
      background: rgba(0,0,0,0.35); padding: 10px 24px;
      border-radius: 999px; pointer-events: none; white-space: nowrap;
      user-select: none; display: none;
    }
    #hint {
      position: fixed; top: 50%; left: 50%;
      transform: translate(-50%, -50%);
      color: white; font: bold 18px Arial, sans-serif;
      text-shadow: 0 2px 8px rgba(0,0,0,0.6);
      background: rgba(0,0,0,0.45); padding: 16px 32px;
      border-radius: 999px; pointer-events: none;
      transition: opacity 0.5s; display: none;
    }
    #interact {
      position: fixed; bottom: 64px; left: 50%;
      transform: translateX(-50%);
      color: white; font: bold 15px Arial, sans-serif;
      background: rgba(0,0,0,0.55); padding: 8px 22px;
      border-radius: 999px; pointer-events: none;
      border: 2px solid rgba(255,255,255,0.35);
      display: none; white-space: nowrap;
    }
  </style>
</head>
<body>

<div id="loading">
  🏘️ Wobbly World
  <p>Ładowanie fizyki...</p>
</div>
<div id="ui">WASD – ruch &nbsp;|&nbsp; SPACJA – skok &nbsp;|&nbsp; Mysz – kamera (kliknij ekran)</div>
<div id="hint">🖱️ Kliknij by sterować kamerą</div>
<div id="interact">E — wsiądź</div>

<script type="importmap">
{
  "imports": {
    "three": "https://cdn.jsdelivr.net/npm/three@0.165.0/build/three.module.js",
    "three/addons/": "https://cdn.jsdelivr.net/npm/three@0.165.0/examples/jsm/"
  }
}
</script>

<script type="module" src="src/main.js"></script>
</body>
</html>
