<!DOCTYPE html>
<html lang="pl">
<head>
<meta charset="UTF-8">
<title>Wobbly Osiedle 🏘️</title>
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; }
  body { overflow: hidden; background: #5BA8E5; }
  #ui {
    position: fixed; bottom: 20px; left: 50%;
    transform: translateX(-50%);
    color: white; font: bold 14px 'Arial Rounded MT Bold', Arial, sans-serif;
    text-shadow: 0 2px 4px rgba(0,0,0,0.5);
    background: rgba(0,0,0,0.35); padding: 10px 24px;
    border-radius: 999px; pointer-events: none; white-space: nowrap;
    user-select: none;
  }
  #hint {
    position: fixed; top: 50%; left: 50%;
    transform: translate(-50%, -50%);
    color: white; font: bold 18px Arial, sans-serif;
    text-shadow: 0 2px 8px rgba(0,0,0,0.6);
    background: rgba(0,0,0,0.45); padding: 16px 32px;
    border-radius: 999px; pointer-events: none;
    transition: opacity 0.5s;
  }
  #score {
    position: fixed; top: 14px; right: 18px;
    color: white; font: bold 16px 'Arial Rounded MT Bold', Arial, sans-serif;
    text-shadow: 0 2px 4px rgba(0,0,0,0.5);
    background: rgba(0,0,0,0.35); padding: 8px 18px;
    border-radius: 999px; pointer-events: none; user-select: none;
  }
  #hint-e {
    position: fixed; bottom: 64px; left: 50%;
    transform: translateX(-50%);
    color: white; font: bold 15px Arial, sans-serif;
    text-shadow: 0 2px 6px rgba(0,0,0,0.6);
    background: rgba(0,0,0,0.50); padding: 8px 24px;
    border-radius: 999px; pointer-events: none;
    border: 2px solid rgba(255,255,255,0.35);
    display: none; white-space: nowrap;
  }
</style>
</head>
<body>
<div id="ui">WASD – ruch &nbsp;|&nbsp; SPACJA – skok &nbsp;|&nbsp; Mysz – kamera (kliknij ekran)</div>
<div id="hint">🖱️ Kliknij by sterować kamerą</div>
<div id="score">⭐ 0 / 15</div>
<div id="hint-e"></div>

<script src="https://cdn.jsdelivr.net/npm/three@0.152.0/build/three.min.js"></script>
<script>
'use strict';

// ─── RENDERER / SCENE ────────────────────────────────────────────────────────
const scene    = new THREE.Scene();
scene.background = new THREE.Color(0x7EC8F5);
scene.fog = new THREE.FogExp2(0x7EC8F5, 0.012);

const camera   = new THREE.PerspectiveCamera(65, innerWidth / innerHeight, 0.1, 300);
const renderer = new THREE.WebGLRenderer({ antialias: true });
renderer.setPixelRatio(Math.min(devicePixelRatio, 2));
renderer.setSize(innerWidth, innerHeight);
renderer.shadowMap.enabled = true;
renderer.shadowMap.type = THREE.PCFSoftShadowMap;
document.body.appendChild(renderer.domElement);

// ─── LIGHTING ─────────────────────────────────────────────────────────────────
scene.add(new THREE.AmbientLight(0xffeedd, 0.65));

const sun = new THREE.DirectionalLight(0xfff5e0, 1.1);
sun.position.set(20, 40, 15);
sun.castShadow = true;
sun.shadow.mapSize.set(2048, 2048);
sun.shadow.camera.near   = 1;
sun.shadow.camera.far    = 180;
sun.shadow.camera.top    = sun.shadow.camera.right  =  80;
sun.shadow.camera.bottom = sun.shadow.camera.left   = -80;
scene.add(sun);

// Hemisphere light for sky/ground color bounce
scene.add(new THREE.HemisphereLight(0x87CEEB, 0x5a9e35, 0.3));

// ─── TOON GRADIENT ────────────────────────────────────────────────────────────
const gradData = new Uint8Array([0, 80, 180, 255]);
const toonGrad = new THREE.DataTexture(gradData, 4, 1, THREE.RedFormat);
toonGrad.minFilter = toonGrad.magFilter = THREE.NearestFilter;
toonGrad.needsUpdate = true;

function tmat(color) {
  return new THREE.MeshToonMaterial({ color, gradientMap: toonGrad });
}

function addOutline(mesh, t = 0.05) {
  const ol = new THREE.Mesh(
    mesh.geometry,
    new THREE.MeshBasicMaterial({ color: 0x111111, side: THREE.BackSide })
  );
  ol.scale.setScalar(1 + t);
  mesh.add(ol);
}

// ─── SPRING ───────────────────────────────────────────────────────────────────
class Spring {
  constructor(k = 18, d = 0.75) {
    this.k = k; this.d = d;
    this.pos = 0; this.vel = 0;
  }
  update(dt, target = 0) {
    const acc = (target - this.pos) * this.k - this.vel * this.d * 2 * Math.sqrt(this.k);
    this.vel += acc * dt;
    this.pos += this.vel * dt;
  }
  kick(v) { this.vel += v; }
}

// ─── CAR ──────────────────────────────────────────────────────────────────────
// Fizyka: prosta arcade (bez biblioteki).
// Koła: inner.rotation.x += speed/WHEEL_R * dt  → prawidłowy kierunek toczenia.
// Skręt: outer.rotation.y = steer  → wizualny skręt przednich kół.
const WHEEL_R       = 0.38;
const CAR_ENTER_R   = 3.5;   // promień wsiadania

class Car {
  constructor(x, z, color, heading = Math.PI) {
    this.root    = new THREE.Group();
    this.heading = heading;
    this.speed   = 0;        // m/s, + = do przodu
    this.steer   = 0;        // rad, bieżący kąt kierownicy
    this.isOccupied = false;
    this._wheels = [];
    this._build(color);
    this.root.position.set(x, 0, z);
    this.root.rotation.y = heading;
    scene.add(this.root);
  }

  _shade(hex, f) {
    return ((Math.round(((hex >> 16) & 0xff) * f)) << 16)
         | ((Math.round(((hex >>  8) & 0xff) * f)) <<  8)
         |   Math.round(( hex        & 0xff) * f);
  }

  _build(color) {
    const bodyMat = tmat(color);
    const glassMat = new THREE.MeshToonMaterial({
      color: 0x6EC6E0, transparent: true, opacity: 0.65, gradientMap: toonGrad });
    const tireM  = tmat(0x1A1A1A);
    const rimM   = tmat(0xBEBEBE);
    const blackM = tmat(0x111111);
    const chromM = tmat(0xD4D4D4);

    const B = (x, y, z, w, h, d, mat, ol = 0) => {
      const m = new THREE.Mesh(new THREE.BoxGeometry(w, h, d), mat);
      m.position.set(x, y, z); m.castShadow = true;
      if (ol > 0) addOutline(m, ol);
      this.root.add(m);
    };
    // Karoseria
    B(0, 0.52,  0,      2.06, 0.48, 4.12, bodyMat, 0.04);
    // Kabina
    B(0, 1.12,  0.12,   1.82, 0.60, 2.28, bodyMat, 0.035);
    // Dach
    B(0, 1.48,  0.12,   1.86, 0.10, 2.30, bodyMat, 0.025);
    // Szyba przednia (ramka + szkło)
    B(0, 1.12,  1.22,   1.75, 0.54, 0.06, blackM);
    B(0, 1.12,  1.24,   1.62, 0.50, 0.05, glassMat);
    // Szyba tylna
    B(0, 1.12, -1.02,   1.75, 0.54, 0.06, blackM);
    B(0, 1.12, -1.04,   1.62, 0.50, 0.05, glassMat);
    // Zderzaki
    B(0, 0.34,  2.12,   2.08, 0.24, 0.16, chromM, 0.025);
    B(0, 0.34, -2.12,   2.08, 0.24, 0.16, chromM, 0.025);
    // Reflektory
    [-0.70, 0.70].forEach(x => {
      B(x, 0.62,  2.10, 0.44, 0.22, 0.06, new THREE.MeshBasicMaterial({ color: 0xFFFDE0 }));
      B(x, 0.62, -2.10, 0.44, 0.18, 0.06, new THREE.MeshBasicMaterial({ color: 0x330000 }));
    });
    // Progi boczne
    [-1.04, 1.04].forEach(x => B(x, 0.28, 0, 0.06, 0.20, 3.80, blackM));

    // 4 koła: FL, FR, RL, RR
    [
      { x: -1.09, z:  1.44, isFront: true  },
      { x:  1.09, z:  1.44, isFront: true  },
      { x: -1.09, z: -1.44, isFront: false },
      { x:  1.09, z: -1.44, isFront: false },
    ].forEach(({ x, z, isFront }) => {
      const outer = new THREE.Group();
      const inner = new THREE.Group();

      // Opona (cylinder, oś → X przez rotation.z=PI/2)
      const tire = new THREE.Mesh(
        new THREE.CylinderGeometry(WHEEL_R, WHEEL_R, 0.26, 8), tireM);
      tire.rotation.z = Math.PI / 2;
      tire.castShadow = true;
      addOutline(tire, 0.04);
      inner.add(tire);

      // Felga
      const rim = new THREE.Mesh(
        new THREE.CylinderGeometry(WHEEL_R * 0.60, WHEEL_R * 0.60, 0.28, 8), rimM);
      rim.rotation.z = Math.PI / 2;
      inner.add(rim);

      // 3 szprychy — stożek (asymetryczny, brak efektu wagon-wheel przy >14 m/s)
      for (let s = 0; s < 3; s++) {
        const sp = new THREE.Mesh(
          new THREE.CylinderGeometry(0.04, 0.14, WHEEL_R * 1.8, 6), rimM);
        sp.rotation.x = (s / 3) * 2 * Math.PI;
        inner.add(sp);
      }

      // Piasta
      const hub = new THREE.Mesh(
        new THREE.CylinderGeometry(WHEEL_R * 0.15, WHEEL_R * 0.15, 0.30, 6), blackM);
      hub.rotation.z = Math.PI / 2;
      inner.add(hub);

      outer.add(inner);
      outer.position.set(x, WHEEL_R, z);
      this.root.add(outer);
      this._wheels.push({ outer, inner, isFront });
    });
  }

  update(dt, inp) {
    const GAS = 14, BRAKE = 24, MAX_FWD = 22, MAX_REV = 8;
    const STEER_SPD = 2.8, MAX_STEER = 0.60;

    // Gaz / hamulec
    if (inp.has('KeyW') || inp.has('ArrowUp')) {
      this.speed = Math.min(MAX_FWD, this.speed + GAS * dt);
    } else if (inp.has('KeyS') || inp.has('ArrowDown')) {
      if (this.speed > 0.3) this.speed = Math.max(0, this.speed - BRAKE * dt);
      else this.speed = Math.max(-MAX_REV, this.speed - GAS * 0.5 * dt);
    } else {
      this.speed *= Math.pow(0.985, dt * 60);
      if (Math.abs(this.speed) < 0.05) this.speed = 0;
    }

    // Kierownica (efektywna tylko przy ruchu)
    const sf    = Math.min(1, Math.abs(this.speed) / 4);
    const slim  = MAX_STEER * (0.25 + sf * 0.75);
    if (inp.has('KeyA') || inp.has('ArrowLeft'))
      this.steer = Math.min( slim, this.steer + STEER_SPD * dt);
    else if (inp.has('KeyD') || inp.has('ArrowRight'))
      this.steer = Math.max(-slim, this.steer - STEER_SPD * dt);
    else {
      this.steer *= Math.pow(0.75, dt * 60);
      if (Math.abs(this.steer) < 0.005) this.steer = 0;
    }

    // Ruch
    this.heading += (this.steer * this.speed / 5.0) * dt;
    this.root.position.x += Math.sin(this.heading) * this.speed * dt;
    this.root.position.z += Math.cos(this.heading) * this.speed * dt;
    this.root.rotation.y  = this.heading;

    // Obracanie kół ──────────────────────────────────────────────────────────
    // heading=π → oś X kół wskazuje w world -X → RHR odwrócona → -= spin
    const spin = (this.speed / WHEEL_R) * dt;
    this._wheels.forEach(({ outer, inner, isFront }) => {
      inner.rotation.x -= spin;
      if (isFront) outer.rotation.y = this.steer;
    });
  }

  get position() { return this.root.position; }
}

// ─── WOBBLY CHARACTER ─────────────────────────────────────────────────────────
class WobblyCharacter {
  constructor(startX = 0, startZ = 0) {
    this.root    = new THREE.Group();
    scene.add(this.root);
    this.pos     = new THREE.Vector3(startX, 0, startZ);
    this.vel     = new THREE.Vector3();
    this.grounded = true;
    this.facing  = 0;

    this.spSquishY = new Spring(22, 0.80);
    this.spSquishX = new Spring(16, 0.70);
    this.spLean    = new Spring(12, 0.70);

    this._buildBody();
    this._buildEyes();
    this._buildLimbs();
  }

  _buildBody() {
    this.bodyGeo  = new THREE.SphereGeometry(0.55, 22, 14);
    this.bodyOrig = this.bodyGeo.attributes.position.array.slice();
    this.bodyMesh = new THREE.Mesh(this.bodyGeo, tmat(0xFF6B9D));
    this.bodyMesh.position.y = 0.58;
    this.bodyMesh.castShadow = true;
    addOutline(this.bodyMesh, 0.07);
    this.root.add(this.bodyMesh);
  }

  _buildEyes() {
    const blackMat = new THREE.MeshBasicMaterial({ color: 0x111111 });
    // Pionowe kapsułkowe oczka
    const makeEye = (side) => {
      const eye = new THREE.Mesh(new THREE.CapsuleGeometry(0.042, 0.10, 4, 8), blackMat);
      eye.position.set(side * 0.20, 0.76, 0.50);
      this.root.add(eye);
      return eye;
    };
    this.lEye = makeEye(-1);
    this.rEye = makeEye(1);
    // Uśmiechnięta buzia (łuk Beziera)
    const smile = new THREE.Mesh(
      new THREE.TubeGeometry(
        new THREE.QuadraticBezierCurve3(
          new THREE.Vector3(-0.17, 0.65, 0.50),
          new THREE.Vector3(0,     0.57, 0.52),
          new THREE.Vector3( 0.17, 0.65, 0.50)
        ), 20, 0.024, 6, false
      ), blackMat
    );
    this.root.add(smile);
  }

  _buildLimbs() {
    const skinMat  = tmat(0xFF6B9D);
    const pantsMat = tmat(0x5B6EE1);
    const shoeMat  = tmat(0x2C2C2C);
    const makeArm = (side) => {
      const g = new THREE.Group();
      const m = new THREE.Mesh(new THREE.CapsuleGeometry(0.10, 0.28, 4, 8), skinMat);
      m.castShadow = true;
      g.add(m);
      g.position.set(side * 0.70, 0.62, 0);
      g.rotation.z = side * -0.25;
      this.root.add(g);
      return g;
    };
    const makeLeg = (side) => {
      const g = new THREE.Group();
      const thigh = new THREE.Mesh(new THREE.CapsuleGeometry(0.13, 0.22, 4, 8), pantsMat);
      thigh.position.y = -0.10;
      thigh.castShadow = true;
      g.add(thigh);
      const shoe = new THREE.Mesh(new THREE.SphereGeometry(0.15, 8, 6), shoeMat);
      shoe.position.set(side * 0.03, -0.29, 0.05);
      shoe.scale.set(1.1, 0.75, 1.3);
      g.add(shoe);
      g.position.set(side * 0.23, 0.16, 0);
      this.root.add(g);
      return g;
    };
    this.lArm = makeArm(-1); this.rArm = makeArm(1);
    this.lLeg = makeLeg(-1); this.rLeg = makeLeg(1);
  }

  _applyWobble() {
    const sy  = THREE.MathUtils.clamp(this.spSquishY.pos, -0.45, 0.45);
    const sx  = THREE.MathUtils.clamp(this.spSquishX.pos, -0.30, 0.30);
    const pos = this.bodyGeo.attributes.position;
    const orig = this.bodyOrig;
    for (let i = 0; i < pos.count; i++) {
      const ox = orig[i*3], oy = orig[i*3+1], oz = orig[i*3+2];
      const sXZ = 1 - sy * 0.5 + sx * 0.25;
      pos.setXYZ(i, ox * sXZ, oy * (1 + sy), oz * sXZ);
    }
    pos.needsUpdate = true;
    this.bodyGeo.computeVertexNormals();
  }

  update(dt, input, camYaw) {
    const dir = new THREE.Vector3();
    if (input.has('KeyW')    || input.has('ArrowUp'))    dir.z -= 1;
    if (input.has('KeyS')    || input.has('ArrowDown'))  dir.z += 1;
    if (input.has('KeyA')    || input.has('ArrowLeft'))  dir.x -= 1;
    if (input.has('KeyD')    || input.has('ArrowRight')) dir.x += 1;
    const moving = dir.lengthSq() > 0;
    if (moving) dir.normalize().applyAxisAngle(new THREE.Vector3(0,1,0), camYaw);

    this.vel.x = dir.x * 5.5;
    this.vel.z = dir.z * 5.5;
    this.vel.y -= 22 * dt;

    if (input.has('Space') && this.grounded) {
      this.vel.y = 9.5;
      this.grounded = false;
      this.spSquishY.kick(-0.4);
    }

    this.pos.addScaledVector(this.vel, dt);

    if (this.pos.y < 0) {
      const impact = -this.vel.y;
      this.pos.y = 0; this.vel.y = 0; this.grounded = true;
      if (impact > 4) this.spSquishY.kick(Math.min(impact * 0.065, 0.5));
    }

    if (moving) {
      const target = Math.atan2(dir.x, dir.z);
      let delta = target - this.facing;
      while (delta >  Math.PI) delta -= Math.PI * 2;
      while (delta < -Math.PI) delta += Math.PI * 2;
      this.facing += delta * Math.min(dt * 14, 1);
    }

    this.spSquishX.update(dt, moving && this.grounded ? 0.18 : 0);
    this.spSquishY.update(dt, 0);
    this.spLean.update(dt, moving ? -0.10 : 0);

    this.root.position.copy(this.pos);
    this.root.rotation.y  = this.facing;
    this.bodyMesh.rotation.x = this.spLean.pos;
    this._applyWobble();

    const t   = performance.now() * 0.007;
    const sw  = Math.sin(t) * 0.60 * (moving && this.grounded ? 1 : 0);
    this.lArm.rotation.x =  sw;
    this.rArm.rotation.x = -sw;
    this.lLeg.rotation.x = -sw * 0.75;
    this.rLeg.rotation.x =  sw * 0.75;

    if (!moving) {
      const br = 1 + Math.sin(performance.now() * 0.002) * 0.035;
      this.bodyMesh.scale.set(1/br, br, 1/br);
    } else {
      this.bodyMesh.scale.set(1, 1, 1);
    }
  }
}

// ═══════════════════════════════════════════════════════════════════════════════
// ─── WORLD BUILDING ───────────────────────────────────────────────────────────
// ═══════════════════════════════════════════════════════════════════════════════

// Palette (Wobbly Life style)
const PALETTES = [
  { wall: 0xFF6B6B, roof: 0xC0392B, door: 0xFFD700,  trim: 0xFFFFFF },
  { wall: 0xFFE55C, roof: 0xE6A817, door: 0xFF6B9D,  trim: 0xFFFFFF },
  { wall: 0x4ECDC4, roof: 0x1AA99F, door: 0xFF9F43,  trim: 0xFFFFFF },
  { wall: 0x54A0FF, roof: 0x2872D9, door: 0xFFE55C,  trim: 0xFFFFFF },
  { wall: 0xA29BFE, roof: 0x6C5CE7, door: 0xFF6B6B,  trim: 0xFFFFFF },
  { wall: 0xFD79A8, roof: 0xD63068, door: 0xA29BFE,  trim: 0xFFFFFF },
  { wall: 0x55EFC4, roof: 0x00B894, door: 0xFF9F43,  trim: 0xFFFFFF },
  { wall: 0xFF9F43, roof: 0xD4670A, door: 0x4ECDC4,  trim: 0xFFFFFF },
  { wall: 0xE17055, roof: 0xB33A22, door: 0xFFE55C,  trim: 0xFFFFFF },
  { wall: 0x74B9FF, roof: 0x2196C8, door: 0xFD79A8,  trim: 0xFFFFFF },
];

// ─── HOUSE ────────────────────────────────────────────────────────────────────
function buildHouse(cx, cz, pal, opts = {}) {
  const {
    w = 4.2, d = 4.0, wallH = 3.2, roofH = 2.2,
    roofStyle = 'pitched',   // 'pitched' | 'flat' | 'dome'
    floors = 1,
    hasChimney = false,
    hasPorch = false,
    garageW = 0,             // >0 adds a side garage
    facing = 0,
  } = opts;

  const g = new THREE.Group();
  const H = wallH * floors;

  // ── WALLS (slightly "puffy" via scale trick)
  const walls = new THREE.Mesh(new THREE.BoxGeometry(w, H, d), tmat(pal.wall));
  walls.position.y = H / 2;
  walls.castShadow = walls.receiveShadow = true;
  addOutline(walls, 0.04);
  g.add(walls);

  // ── ROOF
  if (roofStyle === 'pitched') {
    const roof = new THREE.Mesh(
      new THREE.ConeGeometry(Math.max(w, d) * 0.76, roofH, 4),
      tmat(pal.roof)
    );
    roof.position.y = H + roofH / 2;
    roof.rotation.y = Math.PI / 4;
    roof.castShadow = true;
    addOutline(roof, 0.04);
    g.add(roof);
  } else if (roofStyle === 'flat') {
    const roof = new THREE.Mesh(new THREE.BoxGeometry(w + 0.4, 0.35, d + 0.4), tmat(pal.roof));
    roof.position.y = H + 0.175;
    roof.castShadow = true;
    addOutline(roof, 0.03);
    g.add(roof);
    // Rooftop details
    const edge = new THREE.Mesh(new THREE.BoxGeometry(w + 0.5, 0.3, d + 0.5), tmat(pal.trim));
    edge.position.y = H + 0.5;
    g.add(edge);
  } else if (roofStyle === 'dome') {
    const roof = new THREE.Mesh(
      new THREE.SphereGeometry(Math.max(w, d) * 0.6, 12, 8, 0, Math.PI * 2, 0, Math.PI * 0.5),
      tmat(pal.roof)
    );
    roof.position.y = H;
    roof.castShadow = true;
    addOutline(roof, 0.04);
    g.add(roof);
  }

  // ── CHIMNEY
  if (hasChimney) {
    const ch = new THREE.Mesh(new THREE.BoxGeometry(0.55, 1.6, 0.55), tmat(0x8B5E3C));
    ch.position.set(w * 0.28, H + roofH * 0.4, -d * 0.2);
    ch.castShadow = true;
    addOutline(ch, 0.04);
    g.add(ch);
    // Chimney top
    const cap = new THREE.Mesh(new THREE.CylinderGeometry(0.38, 0.32, 0.2, 8), tmat(0x6B4226));
    cap.position.set(w * 0.28, H + roofH * 0.4 + 0.9, -d * 0.2);
    g.add(cap);
  }

  // ── DOOR FRAME + DOOR
  const doorFrame = new THREE.Mesh(new THREE.BoxGeometry(1.05, 1.95, 0.12), tmat(pal.trim));
  doorFrame.position.set(0, 0.975, d / 2 + 0.06);
  g.add(doorFrame);

  const door = new THREE.Mesh(new THREE.BoxGeometry(0.85, 1.75, 0.14), tmat(pal.door));
  door.position.set(0, 0.875, d / 2 + 0.08);
  addOutline(door, 0.035);
  g.add(door);

  // Door knob
  const knob = new THREE.Mesh(new THREE.SphereGeometry(0.065, 6, 6),
    new THREE.MeshBasicMaterial({ color: 0xFFD700 }));
  knob.position.set(0.3, 0.85, d / 2 + 0.17);
  g.add(knob);

  // ── WINDOWS (front)
  const makeWindow = (lx, ly, lz, rot = 0) => {
    const frame = new THREE.Mesh(new THREE.BoxGeometry(1.05, 0.95, 0.12), tmat(pal.trim));
    frame.position.set(lx, ly, lz);
    frame.rotation.y = rot;
    addOutline(frame, 0.03);
    g.add(frame);

    const glass = new THREE.Mesh(new THREE.PlaneGeometry(0.72, 0.68),
      new THREE.MeshToonMaterial({ color: 0x87CEEB, transparent: true, opacity: 0.60, gradientMap: toonGrad }));
    glass.position.set(lx, ly, lz + (rot === 0 ? 0.07 : 0));
    glass.rotation.y = rot;
    g.add(glass);

    // Cross
    const hb = new THREE.Mesh(new THREE.BoxGeometry(0.74, 0.07, 0.13), tmat(pal.trim));
    hb.position.set(lx, ly, lz + (rot === 0 ? 0.02 : 0));
    hb.rotation.y = rot;
    g.add(hb);
    const vb = new THREE.Mesh(new THREE.BoxGeometry(0.07, 0.70, 0.13), tmat(pal.trim));
    vb.position.set(lx, ly, lz + (rot === 0 ? 0.02 : 0));
    vb.rotation.y = rot;
    g.add(vb);
  };

  makeWindow(-1.25, H * 0.62, d / 2 + 0.07);
  makeWindow( 1.25, H * 0.62, d / 2 + 0.07);

  // Upper floor windows if two stories
  if (floors > 1) {
    makeWindow(-1.25, H * 0.62 + wallH, d / 2 + 0.07);
    makeWindow( 1.25, H * 0.62 + wallH, d / 2 + 0.07);
    makeWindow(-1.25, H * 0.62, -d / 2 - 0.07);
    makeWindow( 1.25, H * 0.62, -d / 2 - 0.07);
    // Between-floor trim
    const ledge = new THREE.Mesh(new THREE.BoxGeometry(w + 0.1, 0.15, d + 0.1), tmat(pal.trim));
    ledge.position.y = wallH;
    g.add(ledge);
  }

  // ── PORCH
  if (hasPorch) {
    const pFloor = new THREE.Mesh(new THREE.BoxGeometry(w * 0.8, 0.18, 1.6), tmat(0xF5DEB3));
    pFloor.position.set(0, 0.09, d / 2 + 0.8);
    pFloor.castShadow = true;
    g.add(pFloor);
    [-1, 1].forEach(s => {
      const post = new THREE.Mesh(new THREE.CylinderGeometry(0.09, 0.09, H * 0.7, 6), tmat(pal.trim));
      post.position.set(s * w * 0.33, H * 0.35, d / 2 + 1.4);
      g.add(post);
    });
    const pRoof = new THREE.Mesh(new THREE.BoxGeometry(w * 0.85, 0.18, 1.7), tmat(pal.roof));
    pRoof.position.set(0, H * 0.72, d / 2 + 0.8);
    pRoof.castShadow = true;
    g.add(pRoof);
  }

  // ── SIDE GARAGE
  if (garageW > 0) {
    const gW = garageW, gH = wallH * 0.8, gD = d * 0.85;
    const gBody = new THREE.Mesh(new THREE.BoxGeometry(gW, gH, gD), tmat(pal.wall));
    gBody.position.set(-(w / 2 + gW / 2), gH / 2, -d * 0.075);
    gBody.castShadow = gBody.receiveShadow = true;
    addOutline(gBody, 0.04);
    g.add(gBody);

    const gRoof = new THREE.Mesh(new THREE.BoxGeometry(gW + 0.2, 0.3, gD + 0.2), tmat(pal.roof));
    gRoof.position.set(-(w / 2 + gW / 2), gH + 0.15, -d * 0.075);
    gRoof.castShadow = true;
    g.add(gRoof);

    const gDoor = new THREE.Mesh(new THREE.BoxGeometry(gW * 0.85, gH * 0.72, 0.12), tmat(pal.door));
    gDoor.position.set(-(w / 2 + gW / 2), gH * 0.36, gD / 2 - d * 0.075 + 0.07);
    addOutline(gDoor, 0.03);
    g.add(gDoor);
    // Garage door lines
    for (let i = 1; i < 4; i++) {
      const line = new THREE.Mesh(
        new THREE.BoxGeometry(gW * 0.85, 0.06, 0.06),
        tmat(0x888888)
      );
      line.position.set(-(w / 2 + gW / 2), gH * 0.72 * (i / 4), gD / 2 - d * 0.075 + 0.14);
      g.add(line);
    }
  }

  // ── FRONT PATH
  const path = new THREE.Mesh(new THREE.BoxGeometry(0.9, 0.05, 2.8), tmat(0xD4C9A8));
  path.position.set(0, 0.025, d / 2 + 1.4);
  path.receiveShadow = true;
  g.add(path);

  // ── WINDOW BOXES / FLOWER POTS (detail)
  [-1.25, 1.25].forEach(wx => {
    const box = new THREE.Mesh(new THREE.BoxGeometry(0.85, 0.22, 0.22), tmat(0x8B4513));
    box.position.set(wx, H * 0.62 - 0.56, d / 2 + 0.12);
    g.add(box);
    // Flowers
    const flowerColor = [0xFF6B6B, 0xFFE55C, 0xFF6B9D, 0xFF9F43][Math.floor(Math.random()*4)];
    const stem = new THREE.Mesh(new THREE.CylinderGeometry(0.03, 0.03, 0.22, 4), tmat(0x3CB558));
    stem.position.set(wx, H * 0.62 - 0.35, d / 2 + 0.12);
    g.add(stem);
    const petal = new THREE.Mesh(new THREE.SphereGeometry(0.12, 6, 5), tmat(flowerColor));
    petal.position.set(wx, H * 0.62 - 0.24, d / 2 + 0.12);
    petal.scale.y = 0.6;
    g.add(petal);
  });

  g.position.set(cx, 0, cz);
  g.rotation.y = facing;
  scene.add(g);
  return g;
}

// ─── FENCE ─────────────────────────────────────────────────────────────────────
function buildFence(cx, cz, fW, fD, color = 0xFFF8DC, facing = 0) {
  const g = new THREE.Group();
  const postH = 0.8, postR = 0.06, railH = 0.08, spacing = 0.55;

  const makeSide = (len, tx, tz, rotY) => {
    const count = Math.floor(len / spacing);
    for (let i = 0; i <= count; i++) {
      const post = new THREE.Mesh(new THREE.CylinderGeometry(postR, postR, postH, 6), tmat(color));
      post.position.y = postH / 2;
      const t = i / count;
      post.position.x = (t - 0.5) * len;
      const rail = new THREE.Mesh(new THREE.BoxGeometry(len, railH, railH), tmat(color));
      rail.position.y = postH * 0.7;
      const rg = new THREE.Group();
      rg.add(post);
      if (i === 0) rg.add(rail);
      const pg = new THREE.Group();
      pg.add(rg);
      pg.position.set(tx + Math.cos(rotY) * (t - 0.5) * len, 0, tz + Math.sin(rotY) * (t - 0.5) * len);
      pg.rotation.y = rotY;
      g.add(pg);
    }
  };

  // 4 sides with gap for path on front (+Z face, center gap ~1.2 wide)
  const halfW = fW / 2, halfD = fD / 2;
  // Back
  makeSide(fW, 0, -halfD, 0);
  // Left
  makeSide(fD, -halfW, 0, Math.PI / 2);
  // Right
  makeSide(fD, halfW, 0, Math.PI / 2);
  // Front left (leave gate gap)
  makeSide(fW / 2 - 0.7, -fW / 4 - 0.35, halfD, 0);
  // Front right
  makeSide(fW / 2 - 0.7,  fW / 4 + 0.35, halfD, 0);

  g.position.set(cx, 0, cz);
  g.rotation.y = facing;
  scene.add(g);
  return g;
}

  [[0,0,0,0.9],[-0.8,0.1,0,0.65],[0.8,0.1,0,0.65],[-0.4,-0.1,0,0.55],[0.4,-0.1,0,0.55]].forEach(([dx,dy,dz,r]) => {

  scene.add(parkGrass);

  // Park trees
  [[-26, 9], [-30, 9], [-26, 15], [-30, 15], [-24, 12], [-32, 12]].forEach(([x, z]) =>
    buildTree(x, z, 0.7, 0x27AE60)
  );
})();

// ─── CARS ─────────────────────────────────────────────────────────────────────
const cars = [
  new Car( 1.2, 26, 0x3498DB),   // niebieski, blisko gracza
  new Car(-1.2, 18, 0xFF4444),   // czerwony, trochę dalej
];

// ─── COLLECTIBLES (gwiazdki) ──────────────────────────────────────────────────
const STAR_XZ = [
  [ 0,   30], [ 0,   22], [ 0,   12], [ 0,    2], [ 0,  -10],
  [ 0,  -20], [ 0,  -32], [-28,  10], [-28,  14], [-28,   6],
  [ 18, -12], [-18, -12], [ 18,  14], [-18,  14], [  0, -44],
];
const stars = STAR_XZ.map(([x, z]) => {
  const g = new THREE.Group();
  const ring = new THREE.Mesh(
    new THREE.TorusGeometry(0.36, 0.09, 8, 16),
    new THREE.MeshToonMaterial({ color: 0xFFD700, gradientMap: toonGrad })
  );
  ring.rotation.x = Math.PI / 2;
  g.add(ring);
  g.add(new THREE.Mesh(
    new THREE.SphereGeometry(0.18, 8, 6),
    new THREE.MeshToonMaterial({ color: 0xFFFF44, gradientMap: toonGrad })
  ));
  g.position.set(x, 0.9, z);
  scene.add(g);
  return { group: g, collected: false };
});

// ═══════════════════════════════════════════════════════════════════════════════
// ─── INPUT / CAMERA / CHARACTER / LOOP ───────────────────────────────────────
// ═══════════════════════════════════════════════════════════════════════════════

const input = new Set();
addEventListener('keydown', e => {
  input.add(e.code);
  if (['Space','ArrowUp','ArrowDown','ArrowLeft','ArrowRight'].includes(e.code))
    e.preventDefault();
});
addEventListener('keyup', e => input.delete(e.code));

let camYaw = 0, camPitch = 0.28, locked = false;
renderer.domElement.addEventListener('click', () => renderer.domElement.requestPointerLock());
document.addEventListener('pointerlockchange', () => {
  locked = document.pointerLockElement === renderer.domElement;
  document.getElementById('hint').style.opacity = locked ? '0' : '1';
});
document.addEventListener('mousemove', e => {
  if (!locked) return;
  camYaw   -= e.movementX * 0.003;
  camPitch  = THREE.MathUtils.clamp(camPitch - e.movementY * 0.003, 0.06, 1.3);
});

const camPos    = new THREE.Vector3(0, 5, 8);
const camLookAt = new THREE.Vector3(0, 1, 0);
const tmpV      = new THREE.Vector3();

const hero  = new WobblyCharacter(0, 34);
const uiEl  = document.getElementById('ui');
const hintE = document.getElementById('hint-e');
const scoreEl = document.getElementById('score');

let drivingCar = null;
let eWasDown   = false;
let score      = 0;

addEventListener('resize', () => {
  camera.aspect = innerWidth / innerHeight;
  camera.updateProjectionMatrix();
  renderer.setSize(innerWidth, innerHeight);
});

let prev = 0;
(function loop(now) {
  requestAnimationFrame(loop);
  const dt = Math.min((now - prev) / 1000, 0.05);
  prev = now;
  const t = now / 1000;

  // ── Obsługa klawisza E (wsiadanie / wysiadanie) ──────────────────────────
  const eDown    = input.has('KeyE');
  const ePressed = eDown && !eWasDown;
  eWasDown = eDown;

  if (ePressed) {
    if (drivingCar) {
      // Wysiądź — pojaw się z boku auta
      const cp = drivingCar.root.position;
      const ex = cp.x + Math.cos(drivingCar.heading) * 2.8;
      const ez = cp.z - Math.sin(drivingCar.heading) * 2.8;
      hero.pos.set(ex, 0, ez);
      hero.vel.set(0, 0, 0);
      hero.root.visible = true;
      drivingCar.speed  = 0;
      drivingCar.isOccupied = false;
      drivingCar = null;
      uiEl.innerHTML = 'WASD – ruch &nbsp;|&nbsp; SPACJA – skok &nbsp;|&nbsp; Mysz – kamera (kliknij ekran)';
    } else {
      // Wsiądź do najbliższego auta w zasięgu
      for (const car of cars) {
        const dx = hero.pos.x - car.position.x;
        const dz = hero.pos.z - car.position.z;
        if (dx * dx + dz * dz < CAR_ENTER_R * CAR_ENTER_R) {
          drivingCar = car;
          car.isOccupied = true;
          hero.root.visible = false;
          uiEl.innerHTML = 'WASD – jedź &nbsp;|&nbsp; E – wysiądź &nbsp;|&nbsp; Mysz – kamera';
          break;
        }
      }
    }
  }

  // ── Update gracza lub auta ───────────────────────────────────────────────
  if (drivingCar) {
    drivingCar.update(dt, input);
  } else {
    hero.update(dt, input, camYaw);
  }

  // ── Drift chmur ──────────────────────────────────────────────────────────
  clouds.forEach(c => {
    c.group.position.x += c.speed * dt;
    if (c.group.position.x > 40) c.group.position.x = -40;
  });

  // ── Gwiazdki: animacja + zbieranie ──────────────────────────────────────
  const collectPos = drivingCar ? drivingCar.root.position : hero.pos;
  stars.forEach((s, i) => {
    if (s.collected) return;
    s.group.rotation.y     = t * 1.6 + i * 0.9;
    s.group.position.y     = 0.9 + Math.sin(t * 2 + i * 1.3) * 0.13;
    const dx = collectPos.x - s.group.position.x;
    const dz = collectPos.z - s.group.position.z;
    if (dx * dx + dz * dz < 1.6 * 1.6) {
      s.collected = true;
      scene.remove(s.group);
      score++;
      scoreEl.textContent = `⭐ ${score} / ${stars.length}`;
    }
  });

  // ── Hint E ──────────────────────────────────────────────────────────────
  if (drivingCar) {
    hintE.textContent = 'E — wysiądź';
    hintE.style.display = 'block';
  } else {
    let near = false;
    for (const car of cars) {
      const dx = hero.pos.x - car.position.x;
      const dz = hero.pos.z - car.position.z;
      if (dx * dx + dz * dz < CAR_ENTER_R * CAR_ENTER_R) { near = true; break; }
    }
    hintE.textContent = near ? 'E — wsiądź' : '';
    hintE.style.display = near ? 'block' : 'none';
  }

  // ── Kamera ──────────────────────────────────────────────────────────────
  if (drivingCar) {
    // Kamera automatycznie podąża za tyłem auta (lerp kąta)
    const targetYaw = drivingCar.heading + Math.PI;
    let diff = targetYaw - camYaw;
    while (diff >  Math.PI) diff -= Math.PI * 2;
    while (diff < -Math.PI) diff += Math.PI * 2;
    camYaw += diff * Math.min(1, dt * 2.5);
  }
  const followPos  = drivingCar ? drivingCar.root.position : hero.pos;
  const camDist    = drivingCar ? 11 : 8;
  const camHeight  = drivingCar ? 2.0 : 1.8;
  const lookYOff   = drivingCar ? 0.8 : 1.0;
  const hz = Math.cos(camPitch) * camDist;
  const hy = Math.sin(camPitch) * camDist;
  tmpV.set(followPos.x + Math.sin(camYaw) * hz, followPos.y + camHeight + hy, followPos.z + Math.cos(camYaw) * hz);
  camPos.lerp(tmpV, 0.12);
  camLookAt.lerp(tmpV.set(followPos.x, followPos.y + lookYOff, followPos.z), 0.15);
  camera.position.copy(camPos);
  camera.lookAt(camLookAt);

  renderer.render(scene, camera);
})(0);
</script>
</body>
</html>
